[build-system]
requires = ["setuptools >= 42.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py37"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — existing codebase uses long lines
    "F403",  # wildcard imports — used intentionally for impacket DCE/RPC
    "F405",  # names from wildcard imports — same reason
    "W293",  # whitespace before ':' — existing style
]

